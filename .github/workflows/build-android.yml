name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: native/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 36 and NDK 28.2.13676358
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build APK (arm64-v8a, all sources)
        run: python3 scripts/build_android.py --abi arm64-v8a --all-sources

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-apk
          path: |
            dist/android/*.apk
            dist/android/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/android/*.apk
          generate_release_notes: true
